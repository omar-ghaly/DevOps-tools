apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodejs-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nodejs
  template:
    metadata:
      labels:
        app: nodejs
    spec:
      tolerations:
        - key: "workload"
          operator: "Equal"
          value: "worker"
          effect: "NoSchedule"

      imagePullSecrets:
        - name: regcred

      # 🟢 init container لتجهيز قاعدة البيانات
      initContainers:
      - name: init-mysql
        image: mysql:5.7
        env:
          - name: DB_HOST
            valueFrom:
              configMapKeyRef:
                name: db-config
                key: DB_HOST
          - name: DB_USER
            valueFrom:
              secretKeyRef:
                name: db-secret
                key: DB_USER
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: db-secret
                key: DB_PASSWORD
        command:
          - sh
          - -c
          - |
            echo "Initializing database..."
            mysql -h $DB_HOST -u$DB_USER -p$DB_PASSWORD -e "CREATE DATABASE IF NOT EXISTS ivolve; \
            CREATE USER IF NOT EXISTS 'appuser'@'%' IDENTIFIED BY 'app123'; \
            GRANT ALL PRIVILEGES ON ivolve.* TO 'appuser'@'%'; \
            FLUSH PRIVILEGES;"
            echo "Database and user created successfully."

      containers:
      - name: nodejs
        image: omarghalyy/nodejs-app:latest
        ports:
          - containerPort: 3000
        env:
          - name: DB_HOST
            valueFrom:
              configMapKeyRef:
                name: db-config
                key: DB_HOST
          - name: DB_USER
            valueFrom:
              secretKeyRef:
                name: db-secret
                key: DB_USER
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: db-secret
                key: DB_PASSWORD
        volumeMounts:
          - name: nodejs-storage
            mountPath: /usr/src/app/data

      volumes:
        - name: nodejs-storage
          persistentVolumeClaim:
            claimName: nodejs-pvc
